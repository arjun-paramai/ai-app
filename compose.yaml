services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: clausecompass
      POSTGRES_USER: clausecompass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clausecompass -d clausecompass"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://clausecompass:${POSTGRES_PASSWORD}@db:5432/clausecompass
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      CHAT_MODEL: ${CHAT_MODEL:-llama3.2}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on: [api]
volumes:
  pgdata:
